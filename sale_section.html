<head>

<title>Xả Kho — Na Xuất Dư</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#fff; --surface:#f7f7f7; --border:#ebebeb;
  --text:#111; --muted:#888;
  --accent:#d4380d; --accent-light:#fff2e8; --accent-mid:#ffd8bf;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--text);}

.sale-waiting{display:none;padding:48px 40px;max-width:900px;margin:0 auto;text-align:center;}
.sale-waiting-inner{border:1.5px solid var(--border);padding:40px 32px;color:var(--muted);font-size:13px;font-weight:300;}

.sale-section{display:none;padding:16px 0 32px;max-width:100%;margin:0;}

.sale-header{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border);padding-left:16px;}
.sale-badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent-light);border:1px solid var(--accent-mid);color:var(--accent);font-size:11px;font-weight:600;letter-spacing:.06em;padding:4px 10px;border-radius:2px;margin-bottom:10px;}
.sale-badge-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}
.sale-title{font-size:32px;font-weight:300;letter-spacing:-.5px;line-height:1.1;}
.sale-title strong{font-weight:600;}
.sale-sub{font-size:13px;color:var(--muted);font-weight:300;margin-top:6px;}

.sale-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--bg);border:none;align-items:stretch;}
.sale-card{background:var(--bg);transition:background .15s;border:1px solid var(--border);margin:-1px 0 0 -1px;display:flex;flex-direction:column;height:100%;}
.sale-card:hover{background:#fafafa;}
.sale-img{aspect-ratio:3/4;background:var(--surface);overflow:hidden;position:relative;}
.sale-img img{width:100%;height:100%;object-fit:cover;display:block;}
.sale-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.sale-tag{position:absolute;top:12px;right:12px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;letter-spacing:.06em;}
.sale-body{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column;justify-content:space-between;}
.sale-name{font-size:13px;font-weight:500;margin-bottom:3px;line-height:1.4;min-height:2.8em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.sale-sku{font-size:11px;color:var(--muted);font-weight:300;margin-bottom:8px;}
.sale-row{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.sale-price{font-size:15px;font-weight:600;color:var(--accent);white-space:nowrap;}
.sale-btn{font-family:'Be Vietnam Pro',sans-serif;font-size:11px;font-weight:600;color:#fff;background:var(--accent);border:none;padding:7px 12px;cursor:pointer;border-radius:1px;letter-spacing:.03em;transition:opacity .15s;text-decoration:none;display:inline-block;white-space:nowrap;flex-shrink:0;}
.sale-btn:hover{opacity:.85;}
.sale-footer{margin-top:16px;padding:12px 16px 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.sale-note,.sale-updated{font-size:11px;color:var(--muted);font-weight:300;}

/* Carousel controls */
.sale-carousel-bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 0 4px;}
.sale-dots{display:flex;gap:6px;align-items:center;}
.sale-dot{width:6px;height:6px;border-radius:50%;background:var(--border);border:none;padding:0;cursor:pointer;transition:background .2s,transform .2s;}
.sale-dot.active{background:var(--accent);transform:scale(1.3);}
.sale-arrow{background:none;border:1px solid var(--border);color:var(--muted);width:28px;height:28px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;transition:border-color .15s,color .15s;flex-shrink:0;}
.sale-arrow:hover{border-color:var(--accent);color:var(--accent);}
.sale-grid{transition:opacity .25s;}
.sale-grid.fading{opacity:0;}

/* ── Responsive — 6 breakpoint Webcake ── */

/* 1024–1439px: 4 cột (iPad Pro 13: 1024px, Surface Pro 10: 912px) */
@media(max-width:1439px){.sale-grid{grid-template-columns:repeat(4,1fr);}}

/* 768–1023px: 3 cột (iPad Mini: 744px) */
@media(max-width:1023px){.sale-grid{grid-template-columns:repeat(3,1fr);}.sale-title{font-size:28px;}}

/* 425–767px: 2 cột — iPhone 16 Pro Max 440px, Pixel 9/10/A55 412px */
@media(max-width:767px){
  .sale-section,.sale-waiting{padding:16px 0 28px;}
  .sale-grid{grid-template-columns:repeat(2,1fr);gap:8px;}
  .sale-header{padding-left:12px;}
  .sale-title{font-size:24px;}
  .sale-body{padding:10px 10px 12px;}
  .sale-tag{top:8px;right:8px;}
}

/* 375–424px: 2 cột — iPhone SE 375px, iPhone 16 393px */
@media(max-width:424px){
  .sale-section,.sale-waiting{padding:12px 0 24px;}
  .sale-grid{grid-template-columns:repeat(2,1fr);gap:6px;}
  .sale-header{padding-left:10px;}
  .sale-title{font-size:22px;}
  .sale-body{padding:8px 8px 10px;}
  .sale-name{font-size:12px;min-height:2.6em;}
  .sale-price{font-size:14px;}
  .sale-btn{padding:6px 10px;font-size:10px;}
  .sale-tag{top:6px;right:6px;font-size:9px;padding:2px 6px;}
}

/* 320–374px: 2 cột — Samsung A55 360px, Galaxy Z Fold gập 402px → 320px */
@media(max-width:374px){
  .sale-grid{grid-template-columns:repeat(2,1fr);gap:4px;}
  .sale-header{padding-left:8px;}
  .sale-title{font-size:19px;}
  .sale-body{padding:7px 7px 9px;}
  .sale-name{font-size:11px;min-height:2.4em;}
  .sale-sku{font-size:10px;margin-bottom:6px;}
  .sale-price{font-size:13px;}
  .sale-btn{padding:5px 8px;font-size:10px;}
  .sale-tag{top:6px;right:6px;font-size:9px;padding:2px 5px;}
}
</style>
</head>

/* ── Carousel ── */
var currentPage = 0;
var autoTimer = null;
var INTERVAL = 5000;

function getPageSize() {
  var w = window.innerWidth;
  if (w >= 1024) return 4;
  if (w >= 768)  return 3;
  return 2;
}

function buildPages() {
  var size = getPageSize();
  var pages = [];
  for (var i = 0; i < SALE_DATA.products.length; i += size) {
    pages.push(SALE_DATA.products.slice(i, i + size));
  }
  return pages;
}

function cardHTML(p) {
  return '<div class="sale-card">' +
    '<div class="sale-img">' +
      '<span class="sale-tag">SALE</span>' +
      (p.image
        ? '<img src="'+p.image+'" alt="'+p.name+'" loading="lazy">'
        : '<div class="sale-img-ph"><svg width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="2" fill="#ebebeb"/><path d="M12 28l7-9 5 6 3-4 5 7H12z" fill="#ccc"/><circle cx="27" cy="15" r="3" fill="#ccc"/></svg></div>') +
    '</div>' +
    '<div class="sale-body">' +
      '<p class="sale-name">'+p.name+'</p>' +
      '<p class="sale-sku">'+p.sku+'</p>' +
      '<div class="sale-row">' +
        '<span class="sale-price">'+p.price+'</span>' +
        '<a href="'+p.link+'" class="sale-btn" target="_top">Mua ngay</a>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function renderDots(pages) {
  var dotsEl = document.getElementById('saleDots');
  dotsEl.innerHTML = '';
  if (pages.length <= 1) {
    document.getElementById('saleCarouselBar').style.display = 'none';
    return;
  }
  pages.forEach(function(_, i) {
    var d = document.createElement('button');
    d.className = 'sale-dot' + (i === currentPage ? ' active' : '');
    d.setAttribute('aria-label', 'Trang ' + (i+1));
    d.addEventListener('click', function() { goToPage(i, true); });
    dotsEl.appendChild(d);
  });
}

function goToPage(idx, resetTimer) {
  var pages = buildPages();
  if (pages.length <= 1) return;
  currentPage = (idx + pages.length) % pages.length;

  var grid = document.getElementById('saleGrid');
  grid.classList.add('fading');

  setTimeout(function() {
    grid.innerHTML = pages[currentPage].map(cardHTML).join('');
    grid.classList.remove('fading');
    // cập nhật dots
    var dots = document.querySelectorAll('.sale-dot');
    dots.forEach(function(d, i) { d.classList.toggle('active', i === currentPage); });
  }, 250);

  if (resetTimer) startAuto();
}

function startAuto() {
  clearInterval(autoTimer);
  autoTimer = setInterval(function() { goToPage(currentPage + 1, false); }, INTERVAL);
}

function renderSale() {
  var pages = buildPages();
  var grid = document.getElementById('saleGrid');

  // render trang đầu
  grid.innerHTML = pages[0].map(cardHTML).join('');

  // dots + arrows
  renderDots(pages);
  document.getElementById('salePrev').addEventListener('click', function() { goToPage(currentPage - 1, true); });
  document.getElementById('saleNext').addEventListener('click', function() { goToPage(currentPage + 1, true); });

  // tự động
  if (pages.length > 1) startAuto();

  // updated time
  var u = new Date(SALE_DATA.updated);
  document.getElementById('saleUpdated').textContent = 'Cập nhật ' + u.getHours() + ':' + String(u.getMinutes()).padStart(2,'0');
}

// rebuild khi resize thay đổi số cột
var resizeTimer;
window.addEventListener('resize', function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function() {
    currentPage = 0;
    var pages = buildPages();
    document.getElementById('saleGrid').innerHTML = pages[0].map(cardHTML).join('');
    renderDots(pages);
    if (pages.length > 1) startAuto();
  }, 200);
});

var now = new Date();
var exp = new Date(SALE_DATA.expires);
if (SALE_DATA.products.length > 0 && now < exp) {
  document.getElementById('saleSection').style.display = 'block';
  renderSale();
} else {
  document.getElementById('saleWaiting').style.display = 'block';
}

function reportHeight() {
  var h = document.body.scrollHeight;
  window.parent.postMessage({ height: h }, '*');
}
reportHeight();
setInterval(reportHeight, 500);
</script>
