<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hot Deal hôm nay — Na Xuất Dư</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff;
  --surface: #f7f7f7;
  --border: #ebebeb;
  --text: #111;
  --muted: #888;
  --fire: #e03b2e;
  --fire-light: #fff1f0;
  --fire-mid: #ffd9d6;
  --gold: #c8930a;
  --gold-light: #fffbee;
  --bar-fill: #111;
  --bar-bg: #e8e8e8;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Be Vietnam Pro', sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* ── WAITING STATE ── */
.hd-waiting {
  display: none;
  padding: 56px 40px;
  max-width: 900px;
  margin: 0 auto;
  text-align: center;
}

.hd-waiting-inner {
  border: 1.5px solid var(--border);
  padding: 48px 32px;
  position: relative;
}

.hd-waiting-eyebrow {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 20px;
}

.hd-waiting-clock {
  font-size: 52px;
  font-weight: 300;
  letter-spacing: -2px;
  color: var(--text);
  line-height: 1;
  margin-bottom: 12px;
  font-variant-numeric: tabular-nums;
}

.hd-waiting-label {
  font-size: 13px;
  color: var(--muted);
  font-weight: 300;
}

.hd-waiting-dot {
  position: absolute;
  top: -5px; left: -5px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border);
}
.hd-waiting-dot:nth-child(2) { left: auto; right: -5px; }
.hd-waiting-dot:nth-child(3) { top: auto; bottom: -5px; left: -5px; }
.hd-waiting-dot:nth-child(4) { top: auto; bottom: -5px; left: auto; right: -5px; }

/* ── ACTIVE STATE ── */
.hd-section {
  display: none;
  padding: 16px 0 32px;
  max-width: 100%;
  margin: 0;
}

/* Header */
.hd-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 20px;
  gap: 24px;
  padding: 0 16px;
}

.hd-title-block {}

.hd-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--fire-light);
  border: 1px solid var(--fire-mid);
  color: var(--fire);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  padding: 4px 10px;
  border-radius: 2px;
  margin-bottom: 10px;
}

.hd-badge-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--fire);
  animation: pulse 1.4s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.7); }
}

.hd-title {
  font-size: 32px;
  font-weight: 300;
  letter-spacing: -0.5px;
  line-height: 1.1;
  color: var(--text);
}

.hd-title strong {
  font-weight: 600;
}

/* Countdown */
.hd-countdown-block {
  text-align: right;
  flex-shrink: 0;
}

.hd-countdown-label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 400;
  margin-bottom: 6px;
}

.hd-countdown {
  display: flex;
  gap: 4px;
  align-items: center;
  justify-content: flex-end;
}

.hd-cd-unit {
  text-align: center;
}

.hd-cd-num {
  font-size: 28px;
  font-weight: 300;
  letter-spacing: -1px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  min-width: 36px;
  display: block;
}

.hd-cd-sep {
  font-size: 22px;
  font-weight: 300;
  color: var(--border);
  margin-bottom: 10px;
  line-height: 1;
}

.hd-cd-label {
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  display: block;
  margin-top: 2px;
}

/* Grid */
.hd-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  background: var(--bg);
  border: none;
}

.hd-card {
  background: var(--bg);
  padding: 0;
  position: relative;
  overflow: hidden;
  transition: background 0.15s;
}

.hd-card:hover { background: #fafafa; }

/* Rank badge */
.hd-rank {
  position: absolute;
  top: 12px; left: 12px;
  z-index: 2;
  width: 24px; height: 24px;
  background: var(--text);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}

.hd-rank.rank-1 {
  background: #c8930a;
  width: 28px; height: 28px;
  font-size: 13px;
}

/* Image */
.hd-img-wrap {
  aspect-ratio: 3/4;
  background: var(--surface);
  overflow: hidden;
  position: relative;
}

.hd-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.hd-img-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
}

/* Sold bar */
.hd-sold-bar-wrap {
  padding: 12px 12px 0;
}

.hd-sold-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}

.hd-sold-count {
  font-size: 12px;
  font-weight: 600;
  color: var(--fire);
}

.hd-sold-count span {
  font-size: 11px;
  font-weight: 400;
  color: var(--muted);
}

.hd-sold-pct {
  font-size: 10px;
  color: var(--muted);
}

.hd-bar {
  height: 3px;
  background: var(--bar-bg);
  border-radius: 2px;
  overflow: hidden;
}

.hd-bar-fill {
  height: 100%;
  background: var(--fire);
  border-radius: 2px;
  transition: width 1s ease;
}

/* Card body */
.hd-body {
  padding: 10px 12px 12px;
}

.hd-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 4px;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hd-sku {
  font-size: 11px;
  color: var(--muted);
  font-weight: 300;
  margin-bottom: 10px;
}

.hd-price-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.hd-price {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
}

.hd-buy-btn {
  font-family: 'Be Vietnam Pro', sans-serif;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: var(--text);
  border: none;
  padding: 7px 12px;
  cursor: pointer;
  border-radius: 1px;
  letter-spacing: 0.03em;
  transition: background 0.15s;
  white-space: nowrap;
  text-decoration: none;
  display: inline-block;
  flex-shrink: 0;
}

.hd-buy-btn:hover { background: var(--fire); }

/* Footer note */
.hd-footer {
  margin-top: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 12px;
  padding: 12px 16px 0;
  border-top: 1px solid var(--border);
}

.hd-footer-note {
  font-size: 11px;
  color: var(--muted);
  font-weight: 300;
}

.hd-updated {
  font-size: 11px;
  color: var(--muted);
  font-weight: 300;
}

/* ── Responsive — 6 breakpoint Webcake ── */

/* 1024–1439px: 4 cột (iPad Pro 13: 1024px, Surface Pro 10: 912px) */
@media (max-width: 1439px) {
  .hd-grid { grid-template-columns: repeat(4, 1fr); }
}

/* 768–1023px: 3 cột (iPad Mini: 744px) */
@media (max-width: 1023px) {
  .hd-grid { grid-template-columns: repeat(3, 1fr); }
  .hd-title { font-size: 28px; }
}

/* 425–767px: 2 cột — iPhone 16 Pro Max 440px, Pixel 9/10/A55 412px */
@media (max-width: 767px) {
  .hd-section, .hd-waiting { padding: 16px 0 28px; }
  .hd-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .hd-header { flex-direction: column; gap: 12px; padding: 0 12px; }
  .hd-title { font-size: 24px; }
  .hd-countdown-block { text-align: left; }
  .hd-countdown { justify-content: flex-start; }
  .hd-sold-bar-wrap { padding: 10px 10px 0; }
  .hd-body { padding: 10px 10px 12px; }
}

/* 375–424px: 2 cột — iPhone SE 375px, iPhone 16 393px */
@media (max-width: 424px) {
  .hd-section, .hd-waiting { padding: 12px 0 24px; }
  .hd-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .hd-header { padding: 0 10px; }
  .hd-title { font-size: 22px; }
  .hd-cd-num { font-size: 22px; }
  .hd-sold-bar-wrap { padding: 8px 8px 0; }
  .hd-body { padding: 8px 8px 10px; }
  .hd-name { font-size: 12px; }
  .hd-price { font-size: 14px; }
  .hd-buy-btn { padding: 6px 10px; font-size: 10px; }
  .hd-rank { width: 20px; height: 20px; font-size: 10px; top: 8px; left: 8px; }
  .hd-rank.rank-1 { width: 24px; height: 24px; font-size: 11px; }
}

/* 320–374px: 2 cột — Samsung A55 360px, Galaxy Z Fold gập 402px → 320px */
@media (max-width: 374px) {
  .hd-grid { grid-template-columns: repeat(2, 1fr); gap: 4px; }
  .hd-header { padding: 0 8px; }
  .hd-title { font-size: 19px; }
  .hd-cd-num { font-size: 20px; }
  .hd-sold-bar-wrap { padding: 7px 7px 0; }
  .hd-sold-count { font-size: 11px; }
  .hd-body { padding: 7px 7px 9px; }
  .hd-name { font-size: 11px; }
  .hd-sku { font-size: 10px; margin-bottom: 6px; }
  .hd-price { font-size: 13px; }
  .hd-buy-btn { padding: 5px 8px; font-size: 10px; }
  .hd-rank { width: 18px; height: 18px; font-size: 9px; top: 6px; left: 6px; }
  .hd-rank.rank-1 { width: 22px; height: 22px; font-size: 10px; }
}
</style>
</head>
<body>

<!-- ══ WAITING STATE (hiển thị khi chưa có data / hết giờ) ══ -->
<div class="hd-waiting" id="hdWaiting">
  <div class="hd-waiting-inner">
    <div class="hd-waiting-dot"></div>
    <div class="hd-waiting-dot"></div>
    <div class="hd-waiting-dot"></div>
    <div class="hd-waiting-dot"></div>
    <p class="hd-waiting-eyebrow">Hot Deal tiếp theo</p>
    <div class="hd-waiting-clock" id="waitClock">08:00</div>
    <p class="hd-waiting-label">Quay lại lúc 8h sáng ngày mai để xem sản phẩm bán chạy nhất hôm nay</p>
  </div>
</div>

<!-- ══ ACTIVE STATE (hiển thị khi có data) ══ -->
<div class="hd-section" id="hdSection">
  <div class="hd-header">
    <div class="hd-title-block">
      <div class="hd-badge">
        <span class="hd-badge-dot"></span>
        Đang bán chạy hôm nay
      </div>
    </div>
    <div class="hd-countdown-block">
      <p class="hd-countdown-label">Deal kết thúc sau</p>
      <div class="hd-countdown">
        <div class="hd-cd-unit">
          <span class="hd-cd-num" id="cdH">00</span>
          <span class="hd-cd-label">giờ</span>
        </div>
        <span class="hd-cd-sep">:</span>
        <div class="hd-cd-unit">
          <span class="hd-cd-num" id="cdM">00</span>
          <span class="hd-cd-label">phút</span>
        </div>
        <span class="hd-cd-sep">:</span>
        <div class="hd-cd-unit">
          <span class="hd-cd-num" id="cdS">00</span>
          <span class="hd-cd-label">giây</span>
        </div>
      </div>
    </div>
  </div>

  <div class="hd-grid" id="hdGrid">
    <!-- Cards được render bởi JS từ data bên dưới -->
  </div>

  <div class="hd-footer">
    <p class="hd-updated" id="hdUpdated"></p>
  </div>
</div>

<script>
// ══════════════════════════════════════════
// DATA — Tool tự động thay thế phần này
// Khi chạy tool thủ công, nó sẽ ghi đè
// HOT_DEAL_DATA bên dưới bằng data thật
// ══════════════════════════════════════════
var HOT_DEAL_DATA = {
  "updated": "2026-10-08T10:26:39",
  "expires": "2026-10-08T23:59:59",
  "products": [
    {
      "rank": 1,
      "sku": "A660",
      "name": "Áo tay dài - A660",
      "price": "149.000đ",
      "sold_today": 24,
      "stock": 999,
      "image": "https://content.pancake.vn/web-media-264/5e/1f/f3/84/abd70fb87b6adf619f5675d1aedfb18c748f6d1e3c25a21bb9c482e7-w:2048-h:2560-l:390539-t:image/jpeg.jpeg",
      "link": "https://www.naxuatdu.vn/products/ao-tay-dai-a660"
    },
    {
      "rank": 2,
      "sku": "B12",
      "name": "Áo ngực - B12",
      "price": "99.000đ",
      "sold_today": 22,
      "stock": 999,
      "image": "https://content.pancake.vn/web-media-264/f3/80/7a/e9/347ef14973e2de5a0a7ee7aefdb540671120eaf5d6a66726629b9fe4-w:1254-h:1254-l:55457-t:image/jpeg.jpeg",
      "link": "https://www.naxuatdu.vn/products/ao-nguc-b12"
    },
    {
      "rank": 3,
      "sku": "S136",
      "name": "Set bộ - S136",
      "price": "175.000đ",
      "sold_today": 16,
      "stock": 999,
      "image": "https://content.pancake.vn/web-media-264/83/17/09/51/9e828c6ca5d9bd0c157d5ce5e689b8c96eccd3de49c2c8e2d2d4e205-w:2048-h:2560-l:545203-t:image/jpeg.jpeg",
      "link": "https://www.naxuatdu.vn/products/set-bo-s136"
    },
    {
      "rank": 4,
      "sku": "A272",
      "name": "Áo len - A272",
      "price": "155.000đ",
      "sold_today": 11,
      "stock": 999,
      "image": "https://content.pancake.vn/web-media-263/41/0b/e3/cf/d7264abcd904e699d0cb568d4ed6756934ec7d4eb82381dc9de0f10c-w:1374-h:1145-l:122178-t:image/jpeg.jpeg",
      "link": "https://www.naxuatdu.vn/products/ao-len-a272"
    }
  ]
};

// ══════════════════════════════════════════
// LOGIC
// ══════════════════════════════════════════
function pad(n) { return String(n).padStart(2, '0'); }

function checkExpiry() {
  var now = new Date();
  var expires = new Date(HOT_DEAL_DATA.expires);
  return now < expires;
}

function renderCards() {
  var grid = document.getElementById('hdGrid');
  grid.innerHTML = '';
  HOT_DEAL_DATA.products.forEach(function(p) {
    var pct = Math.min(Math.round((p.sold_today / p.stock) * 100), 100);
    var card = document.createElement('div');
    card.className = 'hd-card';
    card.innerHTML =
      '<div class="hd-rank' + (p.rank === 1 ? ' rank-1' : '') + '">' + p.rank + '</div>' +
      '<div class="hd-img-wrap">' +
        (p.image
          ? '<img src="' + p.image + '" alt="' + p.name + '" loading="lazy">'
          : '<div class="hd-img-placeholder"><svg width="40" height="40" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="2" fill="#ebebeb"/><path d="M12 28l7-9 5 6 3-4 5 7H12z" fill="#ccc"/><circle cx="27" cy="15" r="3" fill="#ccc"/></svg></div>') +
      '</div>' +
      '<div class="hd-sold-bar-wrap">' +
        '<div class="hd-sold-meta">' +
          '<span class="hd-sold-count">🔥 ' + p.sold_today + ' <span>đã bán hôm nay</span></span>' +
          '<span class="hd-sold-pct">' + pct + '%</span>' +
        '</div>' +
        '<div class="hd-bar"><div class="hd-bar-fill" style="width:' + pct + '%"></div></div>' +
      '</div>' +
      '<div class="hd-body">' +
        '<p class="hd-name">' + p.name + '</p>' +
        '<p class="hd-sku">' + p.sku + '</p>' +
        '<div class="hd-price-row">' +
          '<span class="hd-price">' + p.price + '</span>' +
          '<a href="' + p.link + '" class="hd-buy-btn" target="_top">Mua ngay</a>' +
        '</div>' +
      '</div>';
    grid.appendChild(card);
  });
}

function startCountdown() {
  var expires = new Date(HOT_DEAL_DATA.expires);
  function tick() {
    var now = new Date();
    var diff = expires - now;
    if (diff <= 0) { location.reload(); return; }
    var h = Math.floor(diff / 3600000);
    var m = Math.floor((diff % 3600000) / 60000);
    var s = Math.floor((diff % 60000) / 1000);
    document.getElementById('cdH').textContent = pad(h);
    document.getElementById('cdM').textContent = pad(m);
    document.getElementById('cdS').textContent = pad(s);
  }
  tick();
  setInterval(tick, 1000);
}

function showWaiting() {
  document.getElementById('hdWaiting').style.display = 'block';
  document.getElementById('hdSection').style.display = 'none';
  // Đếm ngược đến 8h sáng mai
  function tickWait() {
    var now = new Date();
    var tomorrow8h = new Date(now);
    tomorrow8h.setDate(tomorrow8h.getDate() + 1);
    tomorrow8h.setHours(8, 0, 0, 0);
    var diff = tomorrow8h - now;
    var h = Math.floor(diff / 3600000);
    var m = Math.floor((diff % 3600000) / 60000);
    document.getElementById('waitClock').textContent = pad(h) + ':' + pad(m);
  }
  tickWait();
  setInterval(tickWait, 60000);
}

function showActive() {
  document.getElementById('hdWaiting').style.display = 'none';
  document.getElementById('hdSection').style.display = 'block';
  renderCards();
  startCountdown();
  var updated = new Date(HOT_DEAL_DATA.updated);
  document.getElementById('hdUpdated').textContent =
    'Cập nhật lúc ' + pad(updated.getHours()) + ':' + pad(updated.getMinutes());
}

// Khởi động - luôn hiển thị active nếu có data
if (HOT_DEAL_DATA.products.length > 0) {
  showActive();
} else {
  showWaiting();
}

// Báo chiều cao thật lên parent (Webcake)
function reportHeight() {
  var h = document.body.scrollHeight;
  window.parent.postMessage({ height: h }, '*');
}
// Báo ngay khi load và mỗi 500ms cho đến khi ổn định
reportHeight();
setInterval(reportHeight, 500);
</script>

</body>
</html>
